<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout History</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; --text: #333; --danger: #ff5e5e; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; font-family: sans-serif; }
        .container { max-width: 500px; margin: 0 auto; }
        
        h2 { text-align: center; color: var(--primary); }
        .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; }
        
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; color: var(--primary); }
        .card-body { font-size: 14px; margin-bottom: 10px; }
        .card-footer { display: flex; justify-content: flex-end; }
        
        .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-back { display: inline-block; margin-bottom: 15px; color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn-back">← Back</a>
        <h2>Workout History</h2>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search..." onkeyup="filterWorkouts()">
            <input type="date" id="dateFilter" onchange="filterWorkouts()">
        </div>

        <div id="workoutList">
            {% for row in records %}
            <div class="card workout-card" data-raw-date="{{ row[1] }}">
                <div class="card-header">
                    <span>{{ row[1] }}</span>
                    <span>{{ row[2] }}</span>
                </div>
                <div class="card-body">
                    <strong>{{ row[3] }}</strong><br>
                    Sets: {{ row[4] }} | Reps: {{ row[5] }} | Weight: {{ row[6] }}
                </div>
                <div class="card-footer">
                    <form action="/delete/{{ row[0] }}" method="POST" onsubmit="return confirm('Delete?');">
                        <button type="submit" class="btn-delete">Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
        <p id="noResults" style="text-align:center; display:none;">Koi record nahi mila.</p>
    </div>

    <script>
        function parseDateToYYYYMMDD(dateStr) {
            // "07 Sep 2026" -> "2026-09-07"
            const months = {
                'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'May': '05', 'Jun': '06',
                'Jul': '07', 'Aug': '08', 'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12'
            };
            const parts = dateStr.split(' '); // ["07", "Sep", "2026"]
            if (parts.length !== 3) return "";
            return `${parts[2]}-${months[parts[1]]}-${parts[0].padStart(2, '0')}`;
        }

        function filterWorkouts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const dateInput = document.getElementById('dateFilter').value;
            const cards = document.querySelectorAll('.workout-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                const rawDate = card.getAttribute('data-raw-date');
                const formattedDate = parseDateToYYYYMMDD(rawDate);
                
                const matchesSearch = text.includes(search);
                const matchesDate = (dateInput === "" || formattedDate === dateInput);
                
                if (matchesSearch && matchesDate) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
        }
    </script>
</body>
</html>
