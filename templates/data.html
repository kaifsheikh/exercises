<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Workouts</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f4f6f9; padding: 20px 10px; }
        .container { background: #ffffff; max-width: 700px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .alert { padding: 10px; background-color: #f8d7da; color: #721c24; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid #e1e8ed; }
        th { background-color: #3498db; color: white; }
        .btn-back { display: inline-block; margin-bottom: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-delete:active { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn-back">← Back to Form</a>
        <h2>Saved Gym Workouts</h2>

        {% if msg %}
            <div class="alert">{{ msg }}</div>
        {% endif %}

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Muscle</th>
                    <th>Exercise</th>
                    <th>Sets</th>
                    <th>Reps</th>
                    <th>Weight</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for row in records %}
                <tr>
                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>
                    <td>{{ row[3] }}</td>
                    <td>{{ row[4] }}</td>
                    <td>{{ row[5] }}</td>
                    <td>{{ row[6] }}</td>
                    <td>
                        <form action="/delete/{{ row[0] }}" method="POST" onsubmit="return confirm('Kia aap waqai is record ko delete karna chahte hain?');">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
