<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; }
        body { background: var(--bg); font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 8px; }
        .btn { width: 100%; background: var(--primary); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add Workout</h2>
        <form action="/add" method="POST">
            <div class="form-group"><input type="date" name="workout_date" value="{{ today_date }}" required></div>
            <div class="form-group"><select name="muscle_name" required>
                <option value="" disabled selected>Select Muscle</option>
                <option value="Chest">Chest</option><option value="Back">Back</option>
            </select></div>
            <div class="form-group"><input type="text" name="exercise_name" placeholder="Exercise" required></div>
            <div class="form-group"><input type="number" name="sets" placeholder="Sets" required></div>
            <div class="form-group"><input type="number" name="reps" placeholder="Reps" required></div>
            <div class="form-group"><input type="text" name="weight" placeholder="Weight (e.g., 20kg)" required></div>
            <button type="submit" class="btn">Save</button>
        </form>
        <a href="/data" style="display:block; text-align:center; margin-top:15px; color:var(--primary);">View History</a>
    </div>
</body>
</html>
